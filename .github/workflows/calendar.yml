name: Master calendar

# Every 2 hours: read the Airbnb, Vrbo and Simply Owners calendars, add direct bookings,
# and publish the merged feeds in calendar/. Also runs straight away
# whenever data/direct-bookings.csv changes.
on:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - data/direct-bookings.csv
      - scripts/build_calendar.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build calendar
        id: build
        env:
          AIRBNB_ICS_URL: ${{ secrets.AIRBNB_ICS_URL }}
          VRBO_ICS_URL: ${{ secrets.VRBO_ICS_URL }}
          SIMPLYOWNERS_ICS_URL: ${{ secrets.SIMPLYOWNERS_ICS_URL }}
          TZ: Europe/London
        run: python3 scripts/build_calendar.py

      - name: Save changes
        if: always()
        run: |
          git config user.name "22sxr calendar"
          git config user.email "actions@users.noreply.github.com"
          git add calendar
          if git diff --cached --quiet; then
            echo "No booking changes."
          else
            git commit -m "Calendar update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
